syntax = "proto3";

package authenticator.assertion;

import "authenticator/assertion/signature.proto";
import "authenticator/assertion/user_handle.proto";
import "authenticator/data.proto";
import "client_data/json.proto";

// Authenticator response to the login ceremony
message Response {
  client_data.JSON client_data_json = 1;
  authenticator.Data authenticator_data = 2;
  Signature signature = 3;
  UserHandle user_handle = 4;
}
